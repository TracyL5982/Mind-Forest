# The walkthrough demo on Fly: one small always-on machine, beside the judging service and apart from it.
# Deploy with deploy/demo.sh; see demo/README.md, "On Fly, without the Mac".
app = "mind-palace-walkthrough"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile.demo"
  ignorefile = "Dockerfile.demo.dockerignore"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a recording must not wait for a machine to wake, and a stopped machine forgets the stage.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
