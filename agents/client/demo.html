<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d11">
<title>Walkthrough rounds</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="demo.css">
</head>
<body>

<header class="top">
  <div class="top-name">
    <div class="top-title" id="title">Walkthrough</div>
    <div class="top-sub" id="sub">Reading the script</div>
  </div>
  <div class="chips" aria-live="polite">
    <span class="chip" id="chip-headset" data-state="off"><i></i><span>No headset joined</span></span>
    <span class="chip" id="chip-voice" data-state="off"><i></i><span>Momo's voice off</span></span>
  </div>
  <div class="top-actions">
    <label class="switch" title="On: whatever you ask next brings the next round. Off: Momo's Scout searches for real.">
      <input type="checkbox" id="scripted" checked>
      <span>Rounds are scripted</span>
    </label>
    <button class="btn" id="go-start" type="button">Empty stage</button>
    <button class="btn" id="go-end" type="button">Whole tree</button>
  </div>
</header>

<div class="progress" id="progress" hidden><div class="progress-bar"><i id="progress-fill"></i></div><span id="progress-text"></span></div>
<div class="problem" id="problem" hidden></div>

<main class="stage">
  <nav class="order" id="order" aria-label="Rounds in the order they are recorded"></nav>
  <section class="chart" id="chart" aria-label="The tree">
    <div class="chart-space" id="chart-space"></div>
  </section>
  <aside class="detail" id="detail" aria-live="polite"></aside>
</main>

<script type="module" src="js/demo.js"></script>
</body>
</html>
